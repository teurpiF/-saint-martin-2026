<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 760" role="img" aria-labelledby="title desc">
<title id="title">Le cochon de Saint-Martin</title><desc id="desc">Illustration vectorielle originale d'un gros cochon humanoïde grotesque et drôle, en débardeur noir déchiré, avec un immense bourrelet destiné à se soulever au clic.</desc>
<defs>
 <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffb09e"/><stop offset=".45" stop-color="#e87578"/><stop offset="1" stop-color="#a83d50"/></linearGradient>
 <linearGradient id="belly" x1="0" y1="0" x2=".7" y2="1"><stop stop-color="#ffb8a7"/><stop offset=".65" stop-color="#e98282"/><stop offset="1" stop-color="#bd5265"/></linearGradient>
 <linearGradient id="snout" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#ffb7ad"/><stop offset="1" stop-color="#c75266"/></linearGradient>
 <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%"><feGaussianBlur stdDeviation="11"/></filter>
 <pattern id="grit" width="37" height="41" patternUnits="userSpaceOnUse"><circle cx="8" cy="9" r="1.7" fill="#672633" opacity=".17"/><path d="M20 27l5 -2" stroke="#672633" opacity=".14" stroke-width="2"/></pattern>
</defs>
